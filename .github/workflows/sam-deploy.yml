# Compila, testa e faz deploy da Lambda + API Gateway na AWS.
name: SAM Deploy

on:
  push:
    branches: [main]
    paths:
      - "lambda-auth/**"
      - ".github/workflows/sam-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sam-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  JAVA_VERSION: "21"
  STACK_NAME: tech-challenge-serverless

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: corretto

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rodar testes unitários
        run: ./gradlew test
        working-directory: lambda-auth/AuthFunction

      - name: Build SAM
        run: sam build --template lambda-auth/template.yaml

      - name: Limpar stack em ROLLBACK_COMPLETE
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Stack em ROLLBACK_COMPLETE, deletando antes do deploy..."
            aws cloudformation delete-stack \
              --stack-name ${{ env.STACK_NAME }} \
              --region ${{ env.AWS_REGION }}
            aws cloudformation wait stack-delete-complete \
              --stack-name ${{ env.STACK_NAME }} \
              --region ${{ env.AWS_REGION }}
            echo "Stack deletado. Prosseguindo com novo deploy."
          else
            echo "Stack status: $STATUS. Nenhuma ação necessária."
          fi

      # Parametros da VPC
      #   VpcSubnetIds="${{ secrets.VPC_SUBNET_IDS }}" \
      #   VpcSecurityGroupIds="${{ secrets.VPC_SECURITY_GROUP_IDS }}" \
      - name: Deploy na AWS
        run: |
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              DbUrl="${{ secrets.DB_URL }}" \
              DbUser="${{ secrets.DB_USER }}" \
              DbPassword="${{ secrets.DB_PASSWORD }}" \
              JwtSecret="${{ secrets.JWT_SECRET }}" \
              EksLoadBalancerDns="${{ secrets.EKS_LOAD_BALANCER_DNS }}"

      - name: Exibir outputs do deploy
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs" \
            --output table
