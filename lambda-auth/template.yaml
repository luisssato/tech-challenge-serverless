AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tech Challenge 3 - Lambda de autenticação + API Gateway da aplicação

# Parâmetros substituídos no deploy via --parameter-overrides ou GitHub Actions secrets
Parameters:

  # Banco 
  DbUrl:
    Type: String
    Description: "URL JDBC do PostgreSQL do os-service."
    Default: jdbc:postgresql://localhost:5432/techchallenge
  DbUser:
    Type: String
    Description: Usuário do banco
    Default: postgres
  DbPassword:
    Type: String
    NoEcho: true  
    Description: Senha do banco
    Default: admin
  DbSchema:
    Type: String
    Description: Schema do banco de dados
    Default: os

  # JWT 
  JwtSecret:
    Type: String
    NoEcho: true  
    Description: "Chave de assinatura JWT."
    Default: minha-chave-secreta-dev-minimo-32-chars!!

  # EKS - Microsserviços
  OsServiceLoadBalancerDns:
    Type: String
    Description: DNS do Load Balancer do os-service no EKS
    Default: ""

  ExecutionServiceLoadBalancerDns:
    Type: String
    Description: DNS do Load Balancer do execution-service no EKS
    Default: ""

  BillingServiceLoadBalancerDns:
    Type: String
    Description: DNS do Load Balancer do billing-service no EKS
    Default: ""

  # IAM 
  LabRoleName:
    Type: String
    Description: Nome da IAM Role pré-existente do AWS Academy
    Default: LabRole

  # VPC 
  VpcSubnetIds:
    Type: CommaDelimitedList
    Description: IDs das subnets privadas
  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Description: IDs dos Security Groups da Lambda

Globals:
  Function:
    Timeout: 20
    MemorySize: 512
    Runtime: java21
    Architectures:
      - x86_64
    LoggingConfig:
      LogFormat: JSON

Resources:

  # API Gateway 
  AuthApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Description: "Roteia /auth para Lambda e /os/*, /execution/*, /billing/* para os microsserviços no EKS"
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: !Sub "${AWS::StackName}-api"
          version: "1.0"
        paths:

          # POST /auth → Lambda (autenticação via CPF)
          /auth:
            post:
              summary: Autentica cliente por CPF e retorna token JWT
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [cpf]
                      properties:
                        cpf:
                          type: string
                          example: "529.982.247-25"
              responses:
                "200":
                  description: Token JWT gerado com sucesso
                "400":
                  description: CPF ausente ou inválido
                "401":
                  description: Cliente não encontrado
                "500":
                  description: Erro interno
              x-amazon-apigateway-integration:
                type: aws_proxy        # envia o evento completo para a Lambda
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthFunction.Arn}/invocations"
                passthroughBehavior: when_no_match

          # -------------------------------------------------------------------
          # /os/{proxy+} → os-service (ordens de serviço, clientes, veículos, login interno)
          # -------------------------------------------------------------------
          /os/{proxy+}:
            x-amazon-apigateway-any-method:
              parameters:
                - name: proxy
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                "200":
                  description: Resposta do os-service
              x-amazon-apigateway-integration:
                type: http_proxy
                httpMethod: ANY
                uri: !Sub "http://${OsServiceLoadBalancerDns}/{proxy}"
                requestParameters:
                  integration.request.path.proxy: method.request.path.proxy
                passthroughBehavior: when_no_match

          # -------------------------------------------------------------------
          # /execution/{proxy+} → execution-service (fila de execução, peças e estoque)
          # -------------------------------------------------------------------
          /execution/{proxy+}:
            x-amazon-apigateway-any-method:
              parameters:
                - name: proxy
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                "200":
                  description: Resposta do execution-service
              x-amazon-apigateway-integration:
                type: http_proxy
                httpMethod: ANY
                uri: !Sub "http://${ExecutionServiceLoadBalancerDns}/{proxy}"
                requestParameters:
                  integration.request.path.proxy: method.request.path.proxy
                passthroughBehavior: when_no_match

          # -------------------------------------------------------------------
          # /billing/{proxy+} → billing-service (orçamentos, pagamentos, tipos de serviço/peça)
          # -------------------------------------------------------------------
          /billing/{proxy+}:
            x-amazon-apigateway-any-method:
              parameters:
                - name: proxy
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                "200":
                  description: Resposta do billing-service
              x-amazon-apigateway-integration:
                type: http_proxy
                httpMethod: ANY
                uri: !Sub "http://${BillingServiceLoadBalancerDns}/{proxy}"
                requestParameters:
                  integration.request.path.proxy: method.request.path.proxy
                passthroughBehavior: when_no_match

  # Lambda 
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: com.fiap.auth.AuthHandler::handleRequest
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/${LabRoleName}"
      Environment:
        Variables:
          DB_URL: !Ref DbUrl
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          DB_SCHEMA: !Ref DbSchema
          JWT_SECRET: !Ref JwtSecret
      Events:
        AuthEvent:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth
            Method: post

      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref VpcSecurityGroupIds

Outputs:
  AuthEndpoint:
    Description: "URL de autenticação — POST { cpf: '...' }"
    Value: !Sub "https://${AuthApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/auth"
  OsProxyEndpoint:
    Description: URL base do proxy para o os-service
    Value: !Sub "https://${AuthApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/os"
  ExecutionProxyEndpoint:
    Description: URL base do proxy para o execution-service
    Value: !Sub "https://${AuthApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/execution"
  BillingProxyEndpoint:
    Description: URL base do proxy para o billing-service
    Value: !Sub "https://${AuthApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/billing"
  AuthFunctionArn:
    Description: ARN da Lambda
    Value: !GetAtt AuthFunction.Arn
